name: 🐛 Bug Report (English)
description: Report an issue, crash, or unexpected behavior in LocationSpoofer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have read the [Documentation](README_EN.md) and searched [existing issues](https://github.com/your-username/LocationSpoofer/issues) before submitting.

  - type: input
    id: app_version
    attributes:
      label: LocationSpoofer Version / Commit Hash
      description: What version or git commit of LocationSpoofer are you using?
      placeholder: "e.g. v1.2.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: android_version
    attributes:
      label: Android Version
      description: What Android OS version is running on your device?
      options:
        - "Android 15 (API 35)"
        - "Android 14 (API 34)"
        - "Android 13 (API 33)"
        - "Android 12 / 12L (API 31/32)"
        - "Android 11 (API 30)"
        - "Android 10 (API 29)"
        - "Android 9.0 (API 28)"
        - "Android 8.0 / 8.1 (API 26/27)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: root_solution
    attributes:
      label: Root Solution & Framework
      description: Which Root manager and LSPosed framework are you using?
      options:
        - "KernelSU + LSPosed (API 101+)"
        - "APatch + LSPosed (API 101+)"
        - "Magisk + LSPosed (API 101+)"
        - "Other Root / Xposed environment"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device & ROM
      description: What device model and ROM are you using?
      placeholder: "e.g. Xiaomi 13 Pro (HyperOS 1.0) / Google Pixel 7 (LineageOS 21)"
    validations:
      required: false

  - type: input
    id: target_app
    attributes:
      label: Target Application
      description: Name and package name/version of the application where the issue occurs.
      placeholder: "e.g. WeChat (com.tencent.mm) v8.0.48 / Baidu Maps (com.baidu.BaiduMap) v20.0"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Describe what went wrong or how the spoofing failed..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions on how to reproduce the behavior.
      value: |
        1. Open LocationSpoofer and configure...
        2. Start simulation...
        3. Launch target application...
        4. See error/unexpected behavior...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Logcat
      description: Please paste any relevant Logcat snippets or LSPosed module logs here.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have granted Root permissions and enabled the module in LSPosed with the target app selected in scope.
          required: true
