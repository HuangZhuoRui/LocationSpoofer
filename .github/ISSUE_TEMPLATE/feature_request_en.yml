name: 💡 Feature Request (English)
description: Suggest an idea or feature enhancement for LocationSpoofer
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for LocationSpoofer! Please describe your idea in detail below.

  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are encountering.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature Description
      description: A clear and concise description of what you want to happen and how you envision the feature working.
      placeholder: "Add an option to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions or Workarounds
      description: A description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
