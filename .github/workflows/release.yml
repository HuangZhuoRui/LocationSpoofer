name: Release on Version Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 允许在 GitHub Actions 网页端手动一键触发

permissions:
  contents: write # 允许 GITHUB_TOKEN 创建 Release 和 Tag

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整的提交历史来获取 tag 和并生成 changelog

      - name: Check Version Status
        id: check_version
        run: |
          # 提取 app/build.gradle.kts 中的 versionName
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo "当前代码中的 versionName: $VERSION_NAME"
          
          if [ -z "$VERSION_NAME" ]; then
            echo "错误：未能从 app/build.gradle.kts 提取到 versionName，终止流程。"
            exit 1
          fi
          
          # 校验版本号格式（支持 x.y.z 或 x.y.z-beta / x.y.z-beta-n / x.y.z-alpha / x.y.z-rc 等）
          if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(beta|alpha|rc)([-.]?[0-9]+)?)?$'; then
            echo "警告：版本号 '$VERSION_NAME' 不符合标准语义化规范 (如 2.4.9, 2.4.9-beta 或 2.4.9-beta-1)，跳过发版。"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TAG_NAME="v$VERSION_NAME"
          
          # 判断是否是 Beta 预发布版本
          if echo "$VERSION_NAME" | grep -qi 'beta'; then
            echo "当前版本为 Beta 测试版 (Pre-release)"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            IS_PRERELEASE="true"
          else
            echo "当前版本为正式版本 (Stable Release)"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            IS_PRERELEASE="false"
          fi
          
          # 检查对应的 tag 是否已经在 GitHub 远端存在（精确匹配行尾，避免 v2.3.6-beta-1 误匹配 v2.3.6）
          if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -qE "refs/tags/$TAG_NAME(\^\{\})?$"; then
            echo "Tag $TAG_NAME 已经在 GitHub 远端存在（已发布过），无需重复构建。"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "=========================================="
          echo "检测到未发布的全新版本: $TAG_NAME"
          echo "版本类型: $([ "$IS_PRERELEASE" = "true" ] && echo "Beta 预发布" || echo "正式稳定版")"
          echo "状态检查通过，准备构建并发布！"
          echo "=========================================="
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        id: changelog
        run: |
          TAG_NAME="${{ steps.check_version.outputs.tag }}"
          IS_PRERELEASE="${{ steps.check_version.outputs.is_prerelease }}"
          
          # 获取上一个基准 tag
          if [ "$IS_PRERELEASE" = "true" ]; then
            # Beta 版本：对比上一个 tag（包括旧 beta）
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          else
            # 正式版：对比上一个正式版 tag（排除包含 beta 的 tag，保证正式版汇总完整日志）
            PREV_TAG=$(git tag -l --sort=-v:refname | grep -vE -- '-beta|_beta' | grep -vx "$TAG_NAME" | head -n 1 || echo "")
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
          fi
          
          # 获取提交记录
          if [ -z "$PREV_TAG" ]; then
            echo "没有找到上一个基准 tag，获取所有提交记录。"
            COMMITS=$(git log --no-merges --pretty=format:"%s")
          else
            echo "上一个基准 tag: $PREV_TAG"
            COMMITS=$(git log $PREV_TAG..HEAD --no-merges --pretty=format:"%s")
          fi
          
          # 初始化 changelog 文件
          echo "" > changelog.txt
          
          # 提取功能更新 (feat:)
          FEATS=$(echo "$COMMITS" | grep "^feat:" | sed 's/^feat:[[:space:]]*/- /' || true)
          if [ -n "$FEATS" ]; then
            echo "## 功能" >> changelog.txt
            echo "$FEATS" >> changelog.txt
            echo "" >> changelog.txt
          fi
          
          # 提取修复 (fix:)
          FIXES=$(echo "$COMMITS" | grep "^fix:" | sed 's/^fix:[[:space:]]*/- /' || true)
          if [ -n "$FIXES" ]; then
            echo "## 修复" >> changelog.txt
            echo "$FIXES" >> changelog.txt
            echo "" >> changelog.txt
          fi
          
          # 如果没有任何匹配的内容，至少留一行记录
          if [ -z "$FEATS" ] && [ -z "$FIXES" ]; then
            echo "常规更新与优化" >> changelog.txt
          fi
          
          cat changelog.txt
          
      - name: Setup Java
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Gradle 需要 Java 17 进行编译
          cache: 'gradle'

      - name: Decode Keystore
        if: steps.check_version.outputs.changed == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Build Release APK
        if: steps.check_version.outputs.changed == 'true'
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

          # 重命名打包好的 APK，准备发布
          APK_DIR="app/build/outputs/apk/release"
          # 寻找构建出来的 apk 并重命名
          find $APK_DIR -name "*.apk" -print0 | while IFS= read -r -d '' file; do
            BASENAME=$(basename "$file")
            if [[ "$BASENAME" == *"arm64-v8a"* ]]; then
              mv "$file" "$APK_DIR/LocationSpoofer-arm64-v8a-${{ steps.check_version.outputs.tag }}.apk"
            elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
              mv "$file" "$APK_DIR/LocationSpoofer-armeabi-v7a-${{ steps.check_version.outputs.tag }}.apk"
            else
              mv "$file" "$APK_DIR/LocationSpoofer-${{ steps.check_version.outputs.tag }}.apk"
            fi
          done

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: LocationSpoofer ${{ steps.check_version.outputs.tag }}
          body_path: changelog.txt
          prerelease: ${{ steps.check_version.outputs.is_prerelease == 'true' }}
          files: app/build/outputs/apk/release/LocationSpoofer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
